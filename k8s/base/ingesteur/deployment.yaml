apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingesteur                        
spec:
  replicas: 1                    
  selector:
    matchLabels:
      app: ingesteur                     
  template:
    metadata:
      labels:
        app: ingesteur                    
    spec:
      containers:
        - name: ingesteur                 
          image: virida-ingesteur:0.2.0
          env:
            - name: MQTT_BROKER
              value: "tcp://mosquitto:1883"
            - name: PGHOST
              value: "timescaledb"
            - name: PGUSER
              value: "virida"
            - name: PGDATABASE
              value: "virida"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m              
              memory: 64Mi           
            limits:
              cpu: 100m             
              memory: 128Mi         
          securityContext:
            runAsNonRoot: true       
            allowPrivilegeEscalation: false   
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz         
              port: http
            periodSeconds: 5    
            failureThreshold: 2 
          livenessProbe:
            httpGet:
              path: /healthz        
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3 


