apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulateur                        
spec:
  replicas: 1                    
  selector:
    matchLabels:
      app: simulateur                     
  template:
    metadata:
      labels:
        app: simulateur                    
    spec:
      containers:
        - name: simulateur                 
          image: virida-simulateur:0.2.0
          env:
            - name: MQTT_BROKER
              value: "tcp://mosquitto:1883"
          resources:
            requests:
              cpu: 50m              
              memory: 64Mi           
            limits:
              cpu: 100m             
              memory: 128Mi         
          securityContext:
            runAsNonRoot: true       
            allowPrivilegeEscalation: false   
            readOnlyRootFilesystem: true    
