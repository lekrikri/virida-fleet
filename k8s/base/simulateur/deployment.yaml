apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulateur                        
spec:
  replicas: 1                    
  selector:
    matchLabels:
      app: simulateur                     
  template:
    metadata:
      labels:
        app: simulateur                    
    spec:
      containers:
        - name: simulateur                 
          image: virida-simulateur:0.3.0
          env:
            - name: MQTT_BROKER
              value: "tcp://mosquitto:1883"
          envFrom:
            - configMapRef:
                name: simulateur-config
          resources:
            requests:
              cpu: 50m              
              memory: 64Mi           
            limits:
              cpu: 100m             
              memory: 128Mi         
          securityContext:
            runAsNonRoot: true       
            allowPrivilegeEscalation: false   
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz         
              port: http
            periodSeconds: 5    
            failureThreshold: 2 
          livenessProbe:
            httpGet:
              path: /healthz        
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3 


