apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: site-client
labels:
  - pairs:
      env: site-client
    includeTemplates: true
images:
  - name: virida-simulateur
    newTag: 0.4.0

patches:
  - path: ressources.yaml

configMapGenerator:
  - name: simulateur-config
    behavior: merge
    literals:
      - SITE=site-client


   
