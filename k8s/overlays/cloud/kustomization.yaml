apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - timescaledb-scelle.yaml
  - podmonitor.yaml

namespace: virida-cloud
labels:
  - pairs:
      env: cloud
    includeTemplates: true
images:
  - name: virida-simulateur
    newTag: 0.6.0
configMapGenerator:
  - name: simulateur-config
    behavior: merge
    literals:
      - SITE=cloud

   
