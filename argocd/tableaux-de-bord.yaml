apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tableaux-de-bord
  namespace: argocd           
spec:
  project: default
  source:
    repoURL: https://github.com/lekrikri/virida-fleet.git             
    targetRevision: main       
    path: k8s/supervision                
  destination:
    server: https://kubernetes.default.svc  
    namespace: supervision
  syncPolicy:
    automated:
      prune: true      
      selfHeal: true
