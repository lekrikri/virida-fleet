apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simulateur-site
  namespace: argocd           
spec:
  project: default
  source:
    repoURL: https://github.com/lekrikri/virida-fleet.git             
    targetRevision: main       
    path: k8s/overlays/site-client
  destination:
    name: virida-site  
    namespace: site-client
  syncPolicy:
    automated:
      prune: true      
      selfHeal: true
