apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simulateur-cloud
  namespace: argocd           
spec:
  project: default
  source:
    repoURL: https://github.com/lekrikri/virida-fleet.git             
    targetRevision: main       
    path: k8s/overlays/cloud                
  destination:
    server: https://kubernetes.default.svc  
    namespace: virida-cloud
  syncPolicy:
    automated:
      prune: true      
      selfHeal: true
