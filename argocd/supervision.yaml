apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supervision
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack                     
    targetRevision: 93.1.1         # la version du chart, figée
    helm:
      valuesObject:
        # Collecter les PodMonitor et les règles de TOUS les namespaces,
        # pas seulement ceux créés par ce chart
        prometheus:
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        # Composants que kind n'expose pas : sinon, des alertes « en panne » permanentes
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: supervision                 # (B) un namespace dédié : supervision
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
